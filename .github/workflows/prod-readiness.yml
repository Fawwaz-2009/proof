name: Prod readiness

# The merge blocker. Previews and local dev work with zero domain — email is
# captured and previews serve from workers.dev — but merging to main arms
# prod, which sends real email and serves the real domain. This check stays
# red, with the full setup checklist as its output, until the repository is
# production-ready. Mark it as a required status check in branch protection
# and merging is impossible before setup is done. It is self-removing: once
# the secrets exist, it passes silently forever.

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  readiness:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ROOT_DOMAIN: ${{ secrets.ROOT_DOMAIN }}
      AUTH_EMAIL_FROM: ${{ secrets.AUTH_EMAIL_FROM }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Check prod credentials
        run: bun scripts/ci/preflight.ts
