name: PR preview

# Every PR gets a fully isolated stage `pr-<n>`: its own Workers, D1 and R2
# (Alchemy stage-scopes each physical name), and email captured to logs —
# nothing real is ever sent outside prod. The stack itself posts the preview
# URL comment on the PR (the GitHub.Comment resource in alchemy.run.ts,
# guarded by PULL_REQUEST), and closing the PR destroys the stage (the
# cleanup safety check refuses any non-pr-* stage).

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: false

env:
  STAGE: pr-${{ github.event.number }}

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ROOT_DOMAIN: ${{ secrets.ROOT_DOMAIN }}
      APP_NAME: ${{ secrets.APP_NAME }}
      APP_SLUG: ${{ secrets.APP_SLUG }}
      AUTH_EMAIL_FROM: ${{ secrets.AUTH_EMAIL_FROM || 'App Preview <noreply@localhost>' }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      # Deploy stamp — identifies the exact merge result the preview serves.
      PULL_REQUEST: ${{ github.event.number }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck
      - name: Deploy preview stage
        run: bunx alchemy deploy --stage "$STAGE" --yes

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: "true"
      # `alchemy destroy` re-evaluates the stack, so teardown needs the same
      # values the deploy had — byte-identical env or it dies before deleting
      # anything (this exact gap leaked previews for days in the reference
      # implementation).
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ROOT_DOMAIN: ${{ secrets.ROOT_DOMAIN }}
      APP_NAME: ${{ secrets.APP_NAME }}
      APP_SLUG: ${{ secrets.APP_SLUG }}
      AUTH_EMAIL_FROM: ${{ secrets.AUTH_EMAIL_FROM || 'App Preview <noreply@localhost>' }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Safety check — never destroy a non-preview stage
        run: |
          case "$STAGE" in
            pr-*) echo "Destroying $STAGE" ;;
            *) echo "Refusing to destroy non-preview stage '$STAGE'"; exit 1 ;;
          esac
      - name: Destroy preview stage (retries — custom-domain deletes transiently fail)
        run: |
          for i in 1 2 3 4; do
            bunx alchemy destroy --stage "$STAGE" --yes && exit 0
            echo "destroy attempt $i failed; retrying in 5s..."; sleep 5
          done
          bunx alchemy destroy --stage "$STAGE" --yes
