name: Deploy prod

# Merge to main → production. Migrations ride the deploy (the D1 resource
# applies pending SQL before the Worker update); there is no manual migrate
# step. The preflight fails loudly — with a pointer to the Prod readiness
# checklist — if prod credentials are missing; prod never half-deploys.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ROOT_DOMAIN: ${{ secrets.ROOT_DOMAIN }}
      APP_NAME: ${{ secrets.APP_NAME }}
      APP_SLUG: ${{ secrets.APP_SLUG }}
      AUTH_EMAIL_FROM: ${{ secrets.AUTH_EMAIL_FROM }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck
      - name: Preflight — prod requires its credentials
        run: bun scripts/ci/preflight.ts
      # The shared Alchemy state store lost the key to every record written before 2026-11-20,
      # so prod's state is rebuilt by adopting the live resources by their pinned names.
      # One deploy only: remove --adopt and this check once it has run.
      - name: Check the state store answers before deploying
        run: curl -sf https://alchemy-state-store.fawwaz-dev.workers.dev/version | grep -q '"version":7'
      - name: Deploy prod (migrate + ship)
        run: bunx alchemy deploy --stage prod --yes --adopt
