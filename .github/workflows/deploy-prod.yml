name: Deploy prod

# Merge to main → production. Migrations ride the deploy (the D1 resource
# applies pending SQL before the Worker update); there is no manual migrate
# step. The preflight fails loudly — with a pointer to the Prod readiness
# checklist — if prod credentials are missing; prod never half-deploys.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ROOT_DOMAIN: ${{ secrets.ROOT_DOMAIN }}
      AUTH_EMAIL_FROM: ${{ secrets.AUTH_EMAIL_FROM }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck
      - name: Preflight — prod requires its credentials
        run: |
          missing=0
          for var in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ROOT_DOMAIN AUTH_EMAIL_FROM R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::$var is not set — see the Prod readiness checklist"
              missing=1
            fi
          done
          exit $missing
      - name: Deploy prod (migrate + ship)
        run: bunx alchemy deploy --stage prod --yes
